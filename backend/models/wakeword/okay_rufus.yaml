# Production-scale LiveKit wakeword config for "Okay Rufus"
# Run from this directory: see README.md

model_name: okay_rufus

target_phrases:
  - "okay rufus"
  - "ok rufus"

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

custom_negative_phrases:
  - "hey rufus"
  - "rufus"
  - "okay roofers"
  - "okay roof us"
  - "okay doofus"
  - "okay ruthless"
  - "okay refills"
  - "oh hey rufus"
  - "hey libby"
  - "hey liquid"
  - "play live"

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
