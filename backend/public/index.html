<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT Speaker Voice Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .status-panel {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-label {
            font-weight: 600;
        }

        .status-value {
            font-family: 'Monaco', 'Menlo', monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .log-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.4;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-timestamp {
            color: #888;
            margin-right: 10px;
        }

        .log-info { color: #4CAF50; }
        .log-warn { color: #FF9800; }
        .log-error { color: #f44336; }
        .log-debug { color: #2196F3; }

        .recording-indicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(244, 67, 54, 0.2);
            border-radius: 8px;
            border: 2px solid #f44336;
        }

        .recording-indicator.active {
            display: flex;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background: #f44336;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .server-url {
            margin-bottom: 20px;
        }

        .server-url input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .server-url input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .intent-panel {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .intent-panel h3 {
            margin-top: 0;
            color: #FFD700;
        }

        .intent-panel pre {
            color: #fff;
            font-size: 1.1em;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 BT Speaker Voice Test</h1>
        
        <div class="server-url">
            <label for="serverUrl" class="status-label">WebSocket Server URL:</label>
            <input type="text" id="serverUrl" placeholder="ws://localhost:8080/voice" value="ws://localhost:8080/voice">
        </div>

        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">Connection:</span>
                <span class="status-value" id="connectionStatus">DISCONNECTED</span>
            </div>
            <div class="status-item">
                <span class="status-label">Mic Status:</span>
                <span class="status-value" id="recordingStatus">INACTIVE</span>
            </div>
            <div class="status-item">
                <span class="status-label">Backend State:</span>
                <span class="status-value" id="backendState">IDLE</span>
            </div>
            <div class="status-item">
                <span class="status-label">Audio Chunks Sent:</span>
                <span class="status-value" id="chunksSent">0</span>
            </div>
        </div>

        <div class="controls">
            <button id="connectBtn" class="btn-primary">Connect & Start Mic</button>
        </div>

        <div class="recording-indicator" id="recordingIndicator">
            <div class="pulse"></div>
            <span id="recordingText">Listening for your command...</span>
        </div>

        <div class="log-panel" id="logPanel">
            <div class="log-entry log-info">
                <span class="log-timestamp">[Ready]</span>
                Click "Connect & Start Mic" to begin.
            </div>
        </div>

        <div class="intent-panel" id="intentPanel">
            <h3 style="margin-top:0; color:#FFD700;">Last Intent</h3>
            <pre id="intentJson"></pre>
        </div>
    </div>

    <script>
        class VoiceTestClient {
            constructor() {
                this.ws = null;
                this.isConnected = false;
                this.isRecording = false;
                this.audioStream = null;
                this.chunksSent = 0;
                this.inputAudioContext = null;
                this.outputAudioContext = null;
                this.audioBufferQueue = [];
                this.isPlaying = false;
                this.nextPlayTime = 0;

                this.initializeElements();
                this.bindEvents();
                this.log('info', 'VAD test client initialized.');
            }

            initializeElements() {
                this.elements = {
                    serverUrl: document.getElementById('serverUrl'),
                    connectionStatus: document.getElementById('connectionStatus'),
                    recordingStatus: document.getElementById('recordingStatus'),
                    backendState: document.getElementById('backendState'),
                    chunksSent: document.getElementById('chunksSent'),
                    connectBtn: document.getElementById('connectBtn'),
                    recordingIndicator: document.getElementById('recordingIndicator'),
                    recordingText: document.getElementById('recordingText'),
                    logPanel: document.getElementById('logPanel'),
                    intentPanel: document.getElementById('intentPanel'),
                    intentJson: document.getElementById('intentJson'),
                };
            }

            bindEvents() {
                this.elements.connectBtn.addEventListener('click', () => {
                    if (this.isConnected) {
                        this.disconnect();
                    } else {
                        this.connectAndRecord();
                    }
                });
            }

            async connectAndRecord() {
                const url = this.elements.serverUrl.value.trim();
                if (!url) {
                    this.log('error', 'Please enter a valid WebSocket URL');
                    return;
                }

                if (this.ws) {
                    this.ws.close();
                }

                try {
                    this.log('info', `Connecting to ${url}...`);
                    this.elements.connectBtn.disabled = true;
                    this.ws = new WebSocket(url);

                    this.ws.onopen = () => {
                        this.isConnected = true;
                        this.updateConnectionStatus('CONNECTED');
                        this.elements.connectBtn.textContent = 'Disconnect';
                        this.elements.connectBtn.className = 'btn-danger';
                        this.log('info', 'WebSocket connected. Starting microphone...');
                        this.startMicrophone();
                    };

                    this.ws.onclose = (event) => {
                        this.isConnected = false;
                        this.isRecording = false;
                        this.updateConnectionStatus('DISCONNECTED');
                        this.updateRecordingStatus('INACTIVE', false);
                        this.elements.connectBtn.textContent = 'Connect & Start Mic';
                        this.elements.connectBtn.className = 'btn-primary';
                        this.log('warn', `WebSocket disconnected: ${event.code}`);
                        if (this.audioStream) {
                            this.audioStream.getTracks().forEach(track => track.stop());
                        }
                    };

                    this.ws.onerror = (error) => {
                        this.log('error', 'WebSocket error. Check server console.');
                    };

                    this.ws.onmessage = (event) => {
                        this.handleMessage(event);
                    };

                } catch (error) {
                    this.log('error', `Connection failed: ${error.message}`);
                } finally {
                    this.elements.connectBtn.disabled = false;
                }
            }

            disconnect() {
                if (this.ws) {
                    this.ws.close();
                }
            }

            async startMicrophone() {
                try {
                    // Initialize output audio context on user interaction
                    if (!this.outputAudioContext || this.outputAudioContext.state === 'closed') {
                        this.outputAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                        this.log('info', 'Output audio context created.');
                    }
                    if (this.outputAudioContext.state === 'suspended') {
                        await this.outputAudioContext.resume();
                    }

                    // Get microphone access
                    this.audioStream = await navigator.mediaDevices.getUserMedia({
                        audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
                    });

                    // Setup input audio context for mic processing
                    this.inputAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    const source = this.inputAudioContext.createMediaStreamSource(this.audioStream);

                    // Create AudioWorklet for efficient audio processing
                    const workletCode = `
                        class AudioProcessor extends AudioWorkletProcessor {
                            process(inputs, outputs, parameters) {
                                const input = inputs[0];
                                if (input.length > 0) {
                                    const pcmData = new Int16Array(input[0].length);
                                    for (let i = 0; i < input[0].length; i++) {
                                        pcmData[i] = Math.max(-1, Math.min(1, input[0][i])) * 32767;
                                    }
                                    this.port.postMessage(pcmData.buffer, [pcmData.buffer]);
                                }
                                return true;
                            }
                        }
                        registerProcessor('audio-processor', AudioProcessor);
                    `;
                    const blob = new Blob([workletCode], { type: 'application/javascript' });
                    const workletUrl = URL.createObjectURL(blob);
                    await this.inputAudioContext.audioWorklet.addModule(workletUrl);
                    URL.revokeObjectURL(workletUrl);

                    const workletNode = new AudioWorkletNode(this.inputAudioContext, 'audio-processor');
                    workletNode.port.onmessage = (event) => {
                        if (this.isRecording && this.ws && this.ws.readyState === WebSocket.OPEN) {
                            this.ws.send(event.data);
                            this.chunksSent++;
                            this.elements.chunksSent.textContent = this.chunksSent;
                        }
                    };
                    source.connect(workletNode);

                    this.isRecording = true;
                    this.chunksSent = 0;
                    this.elements.chunksSent.textContent = '0';
                    this.updateRecordingStatus('LISTENING', true);
                    this.log('info', 'Microphone active. Send audio to server.');

                } catch (error) {
                    this.log('error', `Mic error: ${error.message}`);
                    this.updateRecordingStatus('ERROR', false);
                    this.disconnect();
                }
            }

            handleMessage(event) {
                if (typeof event.data === 'string') {
                    try {
                        const message = JSON.parse(event.data);
                        if (message.intent) {
                            this.displayIntentJson(message);
                        } else if (message.type === 'error') {
                            this.log('error', `Server Error: ${message.message}`);
                        } else if (message.type === 'state_change') {
                            this.updateBackendState(message.state);
                        }
                    } catch (error) {
                        this.log('warn', `Received non-JSON text: "${event.data}"`);
                    }
                } else {
                    // Binary message is audio data
                    this.queueAudioForPlayback(event.data);
                }
            }
            
            queueAudioForPlayback(audioData) {
                this.audioBufferQueue.push(audioData);
                if (!this.isPlaying && this.audioBufferQueue.length > 3) {
                    this.startBufferedPlayback();
                }
            }

            async startBufferedPlayback() {
                if (this.isPlaying) return;
                
                this.isPlaying = true;
                this.log('info', 'Audio response detected. Starting playback.');
                this.nextPlayTime = this.outputAudioContext.currentTime;
                
                // Continuous playback loop that handles new chunks as they arrive
                const playbackLoop = async () => {
                    while (this.audioBufferQueue.length > 0) {
                        const audioData = this.audioBufferQueue.shift();
                        await this.scheduleAudioChunk(audioData);
                    }
                    
                    // Check if more chunks arrived while we were processing
                    if (this.audioBufferQueue.length > 0) {
                        // Continue playing new chunks immediately
                        setTimeout(playbackLoop, 10);
                    } else {
                        // No more chunks currently, but don't stop playback yet
                        // Wait a bit longer for potential new chunks
                        setTimeout(() => {
                            if (this.audioBufferQueue.length > 0) {
                                // New chunks arrived, continue playing
                                playbackLoop();
                            } else {
                                // Still no chunks, wait a bit more but check if playback should continue
                                setTimeout(() => {
                                    if (this.audioBufferQueue.length > 0) {
                                        playbackLoop();
                                    }
                                    // If still no chunks after waiting, playback will be stopped by state change
                                }, 100);
                            }
                        }, 50);
                    }
                };
                
                playbackLoop();
            }

            // Method to explicitly stop playback (called when backend state changes)
            stop() {
                if (this.isPlaying) {
                    this.isPlaying = false;
                    this.log('info', 'Playback stopped by state change.');
                }
            }

            async scheduleAudioChunk(audioData) {
                try {
                    const arrayBuffer = await (audioData instanceof Blob ? audioData.arrayBuffer() : audioData);
                    
                    // The backend sends raw PCM 16-bit 24kHz audio from Gemini Live API
                    const audioBuffer = this.outputAudioContext.createBuffer(1, arrayBuffer.byteLength / 2, 24000);
                    const channelData = audioBuffer.getChannelData(0);
                    const dataView = new DataView(arrayBuffer);

                    for (let i = 0; i < audioBuffer.length; i++) {
                        channelData[i] = dataView.getInt16(i * 2, true) / 32768.0;
                    }

                    const source = this.outputAudioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(this.outputAudioContext.destination);
                    
                    source.start(this.nextPlayTime);
                    this.nextPlayTime += audioBuffer.duration;
                    this.log('debug', `Scheduled audio chunk: ${audioBuffer.duration.toFixed(3)}s`);

                } catch (error) {
                    this.log('error', `Failed to schedule audio chunk: ${error.message}`);
                    this.isPlaying = false; // Stop playback on error
                }
            }

            updateConnectionStatus(status) {
                this.elements.connectionStatus.textContent = status;
                this.elements.connectionStatus.style.color = status === 'CONNECTED' ? '#4CAF50' : '#f44336';
            }

            updateRecordingStatus(status, isActive) {
                this.elements.recordingStatus.textContent = status;
                if (isActive) {
                    this.elements.recordingIndicator.classList.add('active');
                } else {
                    this.elements.recordingIndicator.classList.remove('active');
                }
            }

            updateBackendState(state) {
                this.elements.backendState.textContent = state;
                
                // Update recording indicator text based on state
                if (state === 'WAITING_FOR_USER') {
                    this.elements.recordingText.textContent = 'Your turn to speak...';
                    // Stop playback when we know Gemini finished speaking
                    this.stop();
                } else if (state === 'LISTENING') {
                    this.elements.recordingText.textContent = 'Listening for your command...';
                    // Also stop playback when going back to listening (conversation ended)
                    this.stop();
                } else if (state === 'STREAMING_RESPONSE') {
                    this.elements.recordingText.textContent = 'Assistant is responding...';
                } else if (state === 'PROCESSING_INTENT') {
                    this.elements.recordingText.textContent = 'Processing your request...';
                } else if (state === 'HANDLING_COMMAND') {
                    this.elements.recordingText.textContent = 'Executing command...';
                    // Stop playback for non-conversational commands
                    this.stop();
                }
            }

            log(level, message) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry log-${level}`;
                logEntry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span>${message}`;
                this.elements.logPanel.appendChild(logEntry);
                this.elements.logPanel.scrollTop = this.elements.logPanel.scrollHeight;
            }

            displayIntentJson(json) {
                if (json) {
                    this.elements.intentPanel.style.display = 'block';
                    this.elements.intentJson.textContent = JSON.stringify(json, null, 2);
                } else {
                    this.elements.intentPanel.style.display = 'none';
                    this.elements.intentJson.textContent = '';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new VoiceTestClient();
        });
    </script>
</body>
</html>
